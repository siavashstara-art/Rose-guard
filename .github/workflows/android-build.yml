name: TAVANA Android Studio CI/CD Build & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build Debug APK, Release APK and Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for Gradle wrapper (if present)
        run: chmod +x gradlew || true

      - name: Decode Release Keystore (from Repository Secrets)
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build Debug APK (For Testing & Sideloading)
        run: gradle assembleDebug --stacktrace

      - name: Build Release APK & AAB
        run: |
          if [ -f "my-upload-key.jks" ]; then
            echo "Building signed Release APK and AAB..."
            gradle assembleRelease bundleRelease --stacktrace
          else
            echo "No production keystore secret configured in GitHub. Building unsigned Release APK and Debug artifacts."
            gradle assembleDebug bundleDebug --stacktrace
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tavana-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact (if produced)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tavana-studio-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release AAB Bundle (if produced)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tavana-studio-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
