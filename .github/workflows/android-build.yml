name: TAVANA Android Studio CI/CD Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_github_release:
        description: 'Publish automated GitHub Release with APK & AAB attachments'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (e.g. v1.0.0). Defaults to automated timestamp tag if left blank'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build Debug APK, Release APK and Release AAB
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Environment Files
        run: |
          # Ensure .env exists so secrets plugin does not fail
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Setup Debug Keystore (Resolves validateSigningDebug)
        run: |
          # If debug.keystore is missing, restore from base64 or generate standard debug keystore
          if [ -f "debug.keystore.base64" ] && [ ! -s "debug.keystore" ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "Generating standard debug.keystore..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -l debug.keystore

      - name: Setup Release Keystore (Resolves validateSigningRelease)
        env:
          KEYSTORE_SECRET: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_SECRET" ]; then
            echo "Decoding release keystore from GitHub Secret..."
            echo "$KEYSTORE_SECRET" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No custom production keystore secret found; generating CI upload keystore for APK/AAB..."
            keytool -genkeypair -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Tavana Studio,O=Tavana,C=IR"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=upload" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi
          ls -l my-upload-key.jks

      - name: Build Debug APK & Release APK & Release AAB Bundle
        run: |
          gradle assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Prepare and Organize Distribution Packages
        run: |
          mkdir -p dist_release
          
          # Copy and standardize filenames for direct distribution
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} dist_release/TavanaStudio-Release.apk \;
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} dist_release/TavanaStudio-Debug.apk \;
          find app/build/outputs/bundle/release/ -name "*.aab" -exec cp {} dist_release/TavanaStudio-Release.aab \;
          
          # Generate SHA256 checksums
          cd dist_release
          sha256sum * > SHA256SUMS.txt || true
          cd ..
          
          ls -la dist_release/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tavana-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tavana-studio-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release AAB Bundle (For Google Play / Bazaar / Myket)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tavana-studio-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Determine Release Tag
        id: release_info
        if: (startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_github_release == 'true')
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v1.0.$(date +'%Y%m%d%H%M')"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_title=TAVANA Studio $TAG_NAME" >> $GITHUB_OUTPUT

      - name: Publish Automated GitHub Release with APK & AAB
        uses: softprops/action-gh-release@v2
        if: (startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_github_release == 'true')
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist_release/TavanaStudio-Release.apk
            dist_release/TavanaStudio-Debug.apk
            dist_release/TavanaStudio-Release.aab
            dist_release/SHA256SUMS.txt
          body: |
            ## 📱 انتشار خودکار بسته نرم‌افزاری استودیو توانا (TAVANA Studio)
            
            بسته‌های خروجی شامل نسخه آماده نصب بر روی تلفن همراه (APK) و بسته رسمی ویژه انتشار در فروشگاه‌ها (AAB) به صورت خودکار تولید و امضا شدند:
            
            - **نسخه انتشار نهایی (Release APK):** `TavanaStudio-Release.apk` (قابل نصب مستقیم روی موبایل)
            - **بسته رسمی مارکت‌ها (Release AAB):** `TavanaStudio-Release.aab` (ویژه Google Play، کافه بازار، مایکت)
            - **نسخه عیب‌یابی (Debug APK):** `TavanaStudio-Debug.apk` (ویژه تست و توسعه)
            - **چک‌سام امنیتی:** `SHA256SUMS.txt`
            
            این ساخت به صورت کاملاً خودکار توسط GitHub Actions CI/CD همراه با امضای رسمی انجام شده است.

